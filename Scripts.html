<!-- Client-Side JavaScript Logic for TrackCM Web App (Scripts.html) -->
<script>
  // ==========================================
  // 1. ESTADO GLOBAL DE LA APLICACIÓN
  // ==========================================
  const AppState = {
    currentUser: { id: 'USR002', nombre: 'Prof. Juan Carlos Pérez', correo: 'juan.perez@colegiomexicano.edu.mx', rol: 'Maestro' },
    activeRole: 'Maestro',
    activeCycle: '2026-2027',
    catalogData: null,
    currentFilteredStudents: [],
    selectedStudent: null,
    evalGrade: 'S',
    athleticMode: 'velocidad',
    stopwatch: {
      running: false,
      startTime: 0,
      elapsedTime: 0,
      timerId: null,
      laps: []
    }
  };

  // Mock data para fallback local en desarrollo fuera de Apps Script
  const MockCatalog = {
    ciclosActivos: [
      { id: "2026-2027", nombre: "Ciclo 2026-2027 (Kínder, Primaria, Secundaria)", tipo: "Anual" },
      { id: "2025-2026", nombre: "Ciclo 2025-2026 (Kínder, Primaria, Secundaria)", tipo: "Anual" },
      { id: "2026-3", nombre: "Semestre 2026-3 (Ago - Dic Preparatoria)", tipo: "Semestral" },
      { id: "2027-1", nombre: "Semestre 2027-1 (Ene - Jun Preparatoria)", tipo: "Semestral" }
    ],
    niveles: ["Kínder", "Primaria", "Secundaria", "Preparatoria"],
    gradosPorNivel: {
      "Kínder": ["1°", "2°", "3°"],
      "Primaria": ["1°", "2°", "3°", "4°", "5°", "6°"],
      "Secundaria": ["1°", "2°", "3°"],
      "Preparatoria": ["1° Semestre", "2° Semestre", "3° Semestre", "4° Semestre", "5° Semestre", "6° Semestre"]
    },
    grupos: ["A", "B", "C", "D"],
    alumnos: [
      { id: "ALU001", nombreCompleto: "Mateo Hernández Ruiz", fechaNacimiento: "2016-05-14", genero: "Varonil" },
      { id: "ALU002", nombreCompleto: "Camila Rodríguez Silva", fechaNacimiento: "2016-08-22", genero: "Femenil" },
      { id: "ALU003", nombreCompleto: "Santiago López Castro", fechaNacimiento: "2016-02-10", genero: "Varonil" },
      { id: "ALU004", nombreCompleto: "Valentina Gómez Torres", fechaNacimiento: "2009-11-03", genero: "Femenil" },
      { id: "ALU005", nombreCompleto: "Diego Martínez Flores", fechaNacimiento: "2009-04-18", genero: "Varonil" }
    ],
    inscripciones: [
      { id: "INS001", idAlumno: "ALU001", nivel: "Primaria", grado: "3°", grupo: "A", ciclo: "2026-2027", estatus: "Activo" },
      { id: "INS002", idAlumno: "ALU002", nivel: "Primaria", grado: "3°", grupo: "A", ciclo: "2026-2027", estatus: "Activo" },
      { id: "INS003", idAlumno: "ALU003", nivel: "Primaria", grado: "3°", grupo: "A", ciclo: "2026-2027", estatus: "Activo" },
      { id: "INS004", idAlumno: "ALU004", nivel: "Preparatoria", grado: "2° Semestre", grupo: "A", ciclo: "2026-3", estatus: "Activo" },
      { id: "INS005", idAlumno: "ALU005", nivel: "Preparatoria", grado: "2° Semestre", grupo: "A", ciclo: "2026-3", estatus: "Activo" }
    ]
  };

  // ==========================================
  // 2. PUENTE PUENTE DE EJECUCIÓN (GAS ADAPTER)
  // ==========================================
  const GAS = {
    run: function(functionName, ...args) {
      return new Promise((resolve, reject) => {
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler(res => resolve(res))
            .withFailureHandler(err => reject(err))[functionName](...args);
        } else {
          // Fallback en entorno local / navegador puro
          console.warn(`[Modo Demostración Local] Invocando ${functionName}`, args);
          setTimeout(() => {
            if (functionName === 'getInitialData') resolve(MockCatalog);
            else if (functionName === 'saveAnthropometricRecord') resolve({ success: true, message: 'Registro Antropométrico guardado (Demo)', imc: '18.11' });
            else if (functionName === 'saveAthleticRecord') resolve({ success: true, message: 'Marca Atlética guardada (Demo)' });
            else if (functionName === 'saveQualitativeRecord') resolve({ success: true, message: 'Evaluación Cualitativa guardada (Demo)' });
            else if (functionName === 'getLeaderboards') resolve(getMockLeaderboards(args[0]));
            else if (functionName === 'getStudentExpediente') resolve(getMockExpediente(args[0]));
            else if (functionName === 'initDatabase') resolve({ success: true, message: 'Base de Datos Inicializada (Demo)' });
            else if (functionName === 'seedDemoData') resolve({ success: true, message: 'Datos Demo Cargados' });
            else if (functionName === 'bulkRegisterStudents') resolve({ success: true, count: 2, message: '2 Alumnos agregados (Demo)' });
            else resolve({ success: true });
          }, 300);
        }
      });
    }
  };

  // ==========================================
  // 3. INICIALIZACIÓN DE LA APLICACIÓN
  // ==========================================
  document.addEventListener('DOMContentLoaded', async () => {
    setupEventListeners();
    await loadInitialData();
    switchTab('campo');
  });

  function setupEventListeners() {
    // Selector global de ciclo
    document.getElementById('globalCicloSelect').addEventListener('change', (e) => {
      AppState.activeCycle = e.target.value;
      document.getElementById('campoActiveCycleBadge').innerText = e.target.value;
      onFilterChange();
      renderLeaderboards();
    });

    // Selector simulado de rol
    document.getElementById('roleSelector').addEventListener('change', (e) => {
      onRoleChange(e.target.value);
    });
  }

  async function loadInitialData() {
    try {
      const data = await GAS.run('getInitialData');
      AppState.catalogData = data;
      onNivelChange();
      populateStudentExpedienteSelect();
      renderLeaderboards();
    } catch (err) {
      console.error("Error al cargar datos iniciales:", err);
      showToast("Error de conexión", "Usando modo de datos locales.", "error");
      AppState.catalogData = MockCatalog;
      onNivelChange();
      populateStudentExpedienteSelect();
      renderLeaderboards();
    }
  }

  // ==========================================
  // 4. CONTROLADOR DE ROLES Y NAVEGACIÓN SPA
  // ==========================================
  function switchTab(tabId) {
    const tabs = ['campo', 'expediente', 'leaderboards', 'admin'];
    tabs.forEach(t => {
      const btn = document.getElementById(`tab-${t}`);
      const view = document.getElementById(`view-${t}`);
      if (t === tabId) {
        btn.classList.add('active');
        btn.classList.remove('text-slate-400');
        view.classList.remove('hidden');
      } else {
        btn.classList.remove('active');
        btn.classList.add('text-slate-400');
        view.classList.add('hidden');
      }
    });

    if (tabId === 'expediente') loadStudentExpediente();
    if (tabId === 'leaderboards') renderLeaderboards();
  }

  function onRoleChange(newRole) {
    AppState.activeRole = newRole;
    const badge = document.getElementById('userRoleBadge');
    const name = document.getElementById('userName');
    
    if (newRole === 'Administrador') {
      badge.innerText = 'Administrador';
      badge.className = 'text-[10px] text-amber-400 font-semibold';
      name.innerText = 'Admin Colegio Mex';
      switchTab('admin');
    } else if (newRole === 'Maestro') {
      badge.innerText = 'Docente ED';
      badge.className = 'text-[10px] text-emerald-400 font-semibold';
      name.innerText = 'Prof. Juan Pérez';
      switchTab('campo');
    } else if (newRole === 'Alumno') {
      badge.innerText = 'Alumno Expediente';
      badge.className = 'text-[10px] text-sky-400 font-semibold';
      name.innerText = 'Mateo Hernández';
      switchTab('expediente');
    }
  }

  // ==========================================
  // 5. FILTROS DINÁMICOS Y CASCADA
  // ==========================================
  function onNivelChange() {
    const nivel = document.getElementById('campoNivelSelect').value;
    const gradoSelect = document.getElementById('campoGradoSelect');
    gradoSelect.innerHTML = '';

    const grados = AppState.catalogData.gradosPorNivel[nivel] || ["1°"];
    grados.forEach(g => {
      const opt = document.createElement('option');
      opt.value = g;
      opt.innerText = `${g} Grado/Semestre`;
      gradoSelect.appendChild(opt);
    });

    onFilterChange();
  }

  function onFilterChange() {
    const nivel = document.getElementById('campoNivelSelect').value;
    const grado = document.getElementById('campoGradoSelect').value;
    const grupo = document.getElementById('campoGrupoSelect').value;
    const ciclo = AppState.activeCycle;

    // Buscar inscritos
    const inscritos = AppState.catalogData.inscripciones.filter(i => {
      return i.nivel === nivel && i.grado === grado && i.grupo === grupo && i.ciclo === ciclo;
    });

    const alumnoSelect = document.getElementById('campoAlumnoSelect');
    alumnoSelect.innerHTML = '';

    if (inscritos.length === 0) {
      // Fallback si no hay específicos en el ciclo: mostrar todos los alumnos disponibles
      AppState.catalogData.alumnos.forEach(a => {
        const opt = document.createElement('option');
        opt.value = a.id;
        opt.innerText = `${a.nombreCompleto}`;
        alumnoSelect.appendChild(opt);
      });
    } else {
      inscritos.forEach(i => {
        const alum = AppState.catalogData.alumnos.find(a => a.id === i.idAlumno);
        if (alum) {
          const opt = document.createElement('option');
          opt.value = alum.id;
          opt.innerText = `${alum.nombreCompleto}`;
          alumnoSelect.appendChild(opt);
        }
      });
    }

    onStudentSelectChange();
  }

  function onStudentSelectChange() {
    const studentId = document.getElementById('campoAlumnoSelect').value;
    const student = AppState.catalogData.alumnos.find(a => a.id === studentId);
    if (!student) return;

    AppState.selectedStudent = student;

    // Actualizar Tarjeta de Alumno Seleccionado
    document.getElementById('campoStudentName').innerText = student.nombreCompleto;
    document.getElementById('campoStudentGender').innerText = student.genero;
    
    // Generar iniciales avatar
    const initials = student.nombreCompleto.split(' ').map(n => n[0]).slice(0, 2).join('');
    document.getElementById('campoStudentAvatar').innerText = initials;

    // Edad exacta
    const age = calculateAge(student.fechaNacimiento);
    document.getElementById('campoStudentAge').innerText = `${age} años`;
    
    const nivel = document.getElementById('campoNivelSelect').value;
    const grado = document.getElementById('campoGradoSelect').value;
    const grupo = document.getElementById('campoGrupoSelect').value;
    document.getElementById('campoStudentAcademic').innerText = `${nivel} ${grado}${grupo}`;
  }

  function calculateAge(birthdateStr) {
    if (!birthdateStr) return 10;
    const birth = new Date(birthdateStr);
    const now = new Date();
    let age = now.getFullYear() - birth.getFullYear();
    const monthDiff = now.getMonth() - birth.getMonth();
    if (monthDiff < 0 || (monthDiff === 0 && now.getDate() < birth.getDate())) {
      age--;
    }
    return age > 0 ? age : 10;
  }

  // ==========================================
  // 6. CÁLCULOS ANTROPOMÉTRICOS & IMC
  // ==========================================
  function calculateBMI() {
    const peso = parseFloat(document.getElementById('antropoPeso').value) || 0;
    const estaturaCm = parseFloat(document.getElementById('antropoEstatura').value) || 0;
    
    const imcEl = document.getElementById('antropoIMCValue');
    const statusEl = document.getElementById('antropoIMCStatus');

    if (peso > 0 && estaturaCm > 0) {
      const estM = estaturaCm / 100;
      const imc = (peso / (estM * estM)).toFixed(2);
      imcEl.innerText = imc;

      if (imc < 18.5) {
        statusEl.innerText = "Bajo Peso";
        statusEl.className = "text-xs px-2.5 py-1 rounded-full font-bold bg-sky-500/20 text-sky-300 border border-sky-500/30";
      } else if (imc >= 18.5 && imc <= 24.9) {
        statusEl.innerText = "Normopeso";
        statusEl.className = "text-xs px-2.5 py-1 rounded-full font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
      } else if (imc >= 25.0 && imc <= 29.9) {
        statusEl.innerText = "Sobrepeso";
        statusEl.className = "text-xs px-2.5 py-1 rounded-full font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30";
      } else {
        statusEl.innerText = "Obesidad";
        statusEl.className = "text-xs px-2.5 py-1 rounded-full font-bold bg-red-500/20 text-red-300 border border-red-500/30";
      }
    } else {
      imcEl.innerText = "0.00";
      statusEl.innerText = "Ingrese datos";
      statusEl.className = "text-xs px-2.5 py-1 rounded-full font-bold bg-slate-800 text-slate-400";
    }
  }

  async function handleSaveAntropo(e) {
    e.preventDefault();
    if (!AppState.selectedStudent) return alert("Seleccione un alumno primero.");

    const peso = document.getElementById('antropoPeso').value;
    const estatura = document.getElementById('antropoEstatura').value;
    const comentarios = document.getElementById('antropoComentarios').value;
    const edad = calculateAge(AppState.selectedStudent.fechaNacimiento);

    const payload = {
      idAlumno: AppState.selectedStudent.id,
      cicloEscolar: AppState.activeCycle,
      idMaestro: AppState.currentUser.id,
      edadCalculada: edad,
      pesoKg: peso,
      estaturaCm: estatura,
      comentarios: comentarios
    };

    try {
      const res = await GAS.run('saveAnthropometricRecord', payload);
      if (res.success) {
        showToast("Registro Antropométrico Guardado", `IMC calculado: ${res.imc}`, "success");
        document.getElementById('formAntropo').reset();
        calculateBMI();
      }
    } catch (err) {
      showToast("Error al Guardar", err.message || "Fallo en la conexión.", "error");
    }
  }

  // ==========================================
  // 7. CRONÓMETRO DIGITAL & MÓDULO ATLETISMO
  // ==========================================
  function setAthleticMode(mode) {
    AppState.athleticMode = mode;
    const velBtn = document.getElementById('modeVelBtn');
    const intBtn = document.getElementById('modeIntBtn');
    const modeVelSec = document.getElementById('athleticModeVelocidad');
    const modeIntSec = document.getElementById('athleticModeIntentos');

    if (mode === 'velocidad') {
      velBtn.className = 'px-3 py-1 rounded-lg font-bold bg-sky-500 text-slate-950';
      intBtn.className = 'px-3 py-1 rounded-lg font-bold text-slate-400 hover:text-white';
      modeVelSec.classList.remove('hidden');
      modeIntSec.classList.add('hidden');
    } else {
      intBtn.className = 'px-3 py-1 rounded-lg font-bold bg-amber-500 text-slate-950';
      velBtn.className = 'px-3 py-1 rounded-lg font-bold text-slate-400 hover:text-white';
      modeIntSec.classList.remove('hidden');
      modeVelSec.classList.add('hidden');
    }
  }

  function swStartPause() {
    const sw = AppState.stopwatch;
    const btn = document.getElementById('swStartBtn');

    if (!sw.running) {
      sw.running = true;
      sw.startTime = Date.now() - sw.elapsedTime;
      sw.timerId = setInterval(swUpdate, 10);
      btn.innerText = "Pausar";
      btn.className = "bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-xs py-2 rounded-lg transition";
    } else {
      sw.running = false;
      clearInterval(sw.timerId);
      btn.innerText = "Reanudar";
      btn.className = "bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold text-xs py-2 rounded-lg transition";
    }
  }

  function swUpdate() {
    const sw = AppState.stopwatch;
    sw.elapsedTime = Date.now() - sw.startTime;
    document.getElementById('swDisplay').innerText = formatTimeMs(sw.elapsedTime);
  }

  function swLap() {
    const sw = AppState.stopwatch;
    if (sw.elapsedTime === 0) return;
    const lapTimeStr = formatTimeMs(sw.elapsedTime);
    sw.laps.push(lapTimeStr);

    const container = document.getElementById('swLapsContainer');
    if (sw.laps.length === 1) container.innerHTML = '';

    const div = document.createElement('div');
    div.className = "flex justify-between text-xs px-2 py-1 bg-slate-900 rounded border border-slate-800";
    div.innerHTML = `<span class="text-sky-400 font-bold">Vuelta ${sw.laps.length}</span> <span class="font-mono font-bold text-white">${lapTimeStr}</span>`;
    container.appendChild(div);
  }

  function swReset() {
    const sw = AppState.stopwatch;
    sw.running = false;
    clearInterval(sw.timerId);
    sw.elapsedTime = 0;
    sw.laps = [];
    document.getElementById('swDisplay').innerText = "00:00.00";
    document.getElementById('swLapsContainer').innerHTML = '<p class="text-xs text-slate-500 italic text-center py-4">Presione "Vuelta" durante el cronometraje.</p>';
    
    const btn = document.getElementById('swStartBtn');
    btn.innerText = "Iniciar";
    btn.className = "bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold text-xs py-2 rounded-lg transition";
  }

  function formatTimeMs(ms) {
    const totalSecs = Math.floor(ms / 1000);
    const mins = Math.floor(totalSecs / 60);
    const secs = totalSecs % 60;
    const centis = Math.floor((ms % 1000) / 10);

    const pad = (n) => n.toString().padStart(2, '0');
    return `${pad(mins)}:${pad(secs)}.${pad(centis)}`;
  }

  async function saveVelocidadRecord() {
    if (!AppState.selectedStudent) return alert("Seleccione un alumno primero.");
    const sw = AppState.stopwatch;
    const prueba = document.getElementById('atletismoPruebaSelect').value;
    const puntos = document.getElementById('swPointsInput').value || 90;
    const finalResult = formatTimeMs(sw.elapsedTime);

    if (sw.elapsedTime === 0) return alert("Inicie el cronómetro para registrar un tiempo.");

    const payload = {
      idAlumno: AppState.selectedStudent.id,
      cicloEscolar: AppState.activeCycle,
      idMaestro: AppState.currentUser.id,
      prueba: prueba,
      resultadoPrincipal: `${finalResult}s`,
      detalle: { laps: sw.laps.length > 0 ? sw.laps : [finalResult], totalMs: sw.elapsedTime },
      puntosOMarca: parseFloat(puntos)
    };

    try {
      const res = await GAS.run('saveAthleticRecord', payload);
      if (res.success) {
        showToast("Marca de Cronómetro Guardada", `Tiempo: ${finalResult}s registrado`, "success");
        swReset();
      }
    } catch (err) {
      showToast("Error al Guardar", err.message, "error");
    }
  }

  // ==========================================
  // 8. MULTI-INTENTOS SALTO / LANZAMIENTO
  // ==========================================
  function calculateBestAttempt() {
    const v1 = parseFloat(document.getElementById('intent1Input').value) || 0;
    const v2 = parseFloat(document.getElementById('intent2Input').value) || 0;
    const v3 = parseFloat(document.getElementById('intent3Input').value) || 0;

    const best = Math.max(v1, v2, v3);
    document.getElementById('bestAttemptDisplay').innerText = `${best.toFixed(2)} m`;
  }

  async function saveIntentosRecord() {
    if (!AppState.selectedStudent) return alert("Seleccione un alumno primero.");

    const v1 = parseFloat(document.getElementById('intent1Input').value) || 0;
    const v2 = parseFloat(document.getElementById('intent2Input').value) || 0;
    const v3 = parseFloat(document.getElementById('intent3Input').value) || 0;
    const best = Math.max(v1, v2, v3);

    if (best === 0) return alert("Ingrese al menos 1 intento válido en metros.");

    const prueba = document.getElementById('intentosPruebaSelect').value;
    const puntos = document.getElementById('intentPointsInput').value || (best * 40).toFixed(0);

    const payload = {
      idAlumno: AppState.selectedStudent.id,
      cicloEscolar: AppState.activeCycle,
      idMaestro: AppState.currentUser.id,
      prueba: prueba,
      resultadoPrincipal: `${best.toFixed(2)}m`,
      detalle: { intento1: `${v1}m`, intento2: `${v2}m`, intento3: `${v3}m`, mejorMarca: `${best}m` },
      puntosOMarca: parseFloat(puntos)
    };

    try {
      const res = await GAS.run('saveAthleticRecord', payload);
      if (res.success) {
        showToast("Marca de Intentos Guardada", `Mejor intento: ${best.toFixed(2)}m`, "success");
        document.getElementById('intent1Input').value = '';
        document.getElementById('intent2Input').value = '';
        document.getElementById('intent3Input').value = '';
        calculateBestAttempt();
      }
    } catch (err) {
      showToast("Error al Guardar", err.message, "error");
    }
  }

  // ==========================================
  // 9. EVALUACIONES CUALITATIVAS
  // ==========================================
  function selectEvalGrade(grade) {
    AppState.evalGrade = grade;
    const btnS = document.getElementById('evalBtnS');
    const btnR = document.getElementById('evalBtnR');
    const btnNA = document.getElementById('evalBtnNA');

    [btnS, btnR, btnNA].forEach(b => b.className = "eval-btn border border-slate-700 bg-slate-900 text-slate-400 rounded-xl py-2 text-xs font-black");

    if (grade === 'S') btnS.className = "eval-btn selected-S rounded-xl py-2 text-xs font-black";
    if (grade === 'R') btnR.className = "eval-btn selected-R rounded-xl py-2 text-xs font-black";
    if (grade === 'N/A') btnNA.className = "eval-btn selected-NA rounded-xl py-2 text-xs font-black";
  }

  async function handleSaveQualitative(e) {
    e.preventDefault();
    if (!AppState.selectedStudent) return alert("Seleccione un alumno primero.");

    const prueba = document.getElementById('cualiPruebaSelect').value;

    const payload = {
      idAlumno: AppState.selectedStudent.id,
      cicloEscolar: AppState.activeCycle,
      idMaestro: AppState.currentUser.id,
      pruebaODeporte: prueba,
      valorOCalificacion: AppState.evalGrade
    };

    try {
      const res = await GAS.run('saveQualitativeRecord', payload);
      if (res.success) {
        showToast("Evaluación Cualitativa Guardada", `Prueba ${prueba}: (${AppState.evalGrade})`, "success");
      }
    } catch (err) {
      showToast("Error al Guardar", err.message, "error");
    }
  }

  // ==========================================
  // 10. CONSULTA EXPEDIENTE DEL ALUMNO
  // ==========================================
  function populateStudentExpedienteSelect() {
    const select = document.getElementById('expedienteAlumnoSelect');
    select.innerHTML = '';
    AppState.catalogData.alumnos.forEach(a => {
      const opt = document.createElement('option');
      opt.value = a.id;
      opt.innerText = a.nombreCompleto;
      select.appendChild(opt);
    });
  }

  async function loadStudentExpediente() {
    const id = document.getElementById('expedienteAlumnoSelect').value || (AppState.catalogData.alumnos[0] ? AppState.catalogData.alumnos[0].id : 'ALU001');
    
    try {
      const exp = await GAS.run('getStudentExpediente', id);
      
      const alum = exp.alumno || AppState.catalogData.alumnos.find(a => a.id === id) || { nombreCompleto: "Alumno", fechaNacimiento: "2016-01-01" };
      document.getElementById('expNombre').innerText = alum.nombreCompleto;
      const initials = alum.nombreCompleto.split(' ').map(n => n[0]).slice(0, 2).join('');
      document.getElementById('expAvatar').innerText = initials;

      // Antropométricos
      const antTim = document.getElementById('expAntropoTimeline');
      antTim.innerHTML = '';
      if (exp.antropometricos && exp.antropometricos.length > 0) {
        const last = exp.antropometricos[exp.antropometricos.length - 1];
        document.getElementById('expLastPeso').innerText = `${last.peso} kg`;
        document.getElementById('expLastEstatura').innerText = `${last.estatura} cm`;
        document.getElementById('expLastIMC').innerText = `${last.imc}`;

        exp.antropometricos.forEach(rec => {
          antTim.innerHTML += `

  // ==========================================
  // 12. GESTIÓN DE CARGA MASIVA CSV & DEMO
  // ==========================================
  async function handleCSVUpload() {
    const raw = document.getElementById('csvInputText').value.trim();
    if (!raw) return alert("Pegue o ingrese filas formateadas por coma.");

    const lines = raw.split('\n');
    const csvArray = lines.map(l => l.split(','));

    try {
      const res = await GAS.run('bulkRegisterStudents', csvArray, AppState.activeCycle);
      if (res.success) {
        showToast("Carga Masiva Exitosa", res.message, "success");
        document.getElementById('csvInputText').value = '';
        await loadInitialData();
      }
    } catch (err) {
      showToast("Error en Carga Masiva", err.message, "error");
    }
  }

  async function handleInitDatabase() {
    try {
      const res = await GAS.run('initDatabase');
      showToast("Inicialización", res.message, "success");
    } catch (err) {
      showToast("Error de Inicialización", err.message, "error");
    }
  }

  async function handleSeedDemo() {
    try {
      const res = await GAS.run('seedDemoData');
      showToast("Datos Demo Cargados", res.message, "success");
      await loadInitialData();
    } catch (err) {
      showToast("Error al Cargar Demo", err.message, "error");
    }
  }

  // ==========================================
  // 13. SISTEMA DE NOTIFICACIONES (TOAST)
  // ==========================================
  function showToast(title, message, type = 'success') {
    const toast = document.getElementById('toastNotification');
    const titleEl = document.getElementById('toastTitle');
    const msgEl = document.getElementById('toastMessage');
    const icon = document.getElementById('toastIcon');

    titleEl.innerText = title;
    msgEl.innerText = message;

    if (type === 'success') {
      icon.className = "fa-solid fa-circle-check text-emerald-400 text-xl";
    } else {
      icon.className = "fa-solid fa-triangle-exclamation text-red-400 text-xl";
    }

    toast.classList.remove('hidden');
    setTimeout(() => {
      dismissToast();
    }, 5000);
  }
